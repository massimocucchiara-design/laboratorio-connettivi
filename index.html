<!DOCTYPE html>
<html lang="it">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

      max-width: 900px;
      margin: 0 auto;

      padding: 40px;

      color: #3446a3;
    }

    .subtitle {
      color: #666;

<body>

    <h1>Laboratorio della frase e dei connettivi</h1>

    <p class="subtitle">
      Impara a costruire sequenze coerenti, riconoscere le relazioni logiche

    <div class="box">
      <strong>Versione 1 in costruzione</strong>
      <p>
        Qui compariranno gli esercizi interattivi di riordino delle frasi
